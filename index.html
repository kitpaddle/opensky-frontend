<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenSky ETL - Flight Analysis</title>
    <!-- Configure Cesium assets from CDN -->
    <script>
      // Point Cesium to CDN assets since we're loading from CDN
      window.CESIUM_BASE_URL = 'https://lfv-analyzer.se/cesium/';
      if (typeof window !== 'undefined') {
        window.CESIUM_ION_CONFIGURED = false;
      }
    </script>
    <!-- Cesium from jsDelivr CDN (more reliable) -->
    <script src="https://lfv-analyzer.se/cesium/Cesium.js"></script>
    <script>
      // Disable Ion authentication immediately after Cesium loads to prevent 401 errors
      if (window.Cesium) {
        console.log('[HTML Init] Configuring Cesium...')
        // Disable Ion completely
        window.Cesium.Ion.defaultAccessToken = ''
        // Set a blank server to prevent default Ion provider
        try {
          window.Cesium.Ion.defaultServer = undefined
        } catch (e) {
          console.warn('[HTML Init] Could not set Ion.defaultServer')
        }
        console.log('[HTML Init] ✓ Cesium Ion disabled')
      } else {
        console.error('[HTML Init] ❌ Cesium failed to load!')
      }
    </script>
    <link href="https://lfv-analyzer.se/cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body, #app {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #1e1e2e;
        height: 100%;
        border-radius: 0;
      }
      /* Cesium fixes */
      .cesium-container .cesium-widget-Credits {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
